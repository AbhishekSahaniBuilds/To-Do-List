<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../css/login_page.css" />
    <link rel="icon" href="../icons/site_logo.png" />
  </head>
  <body>
    <div class="container">
      <div class="top_container">
        <div class="back_icon_holder">
          <a href="../../index.html"
            ><img src="../icons/back_icon.png" id="back_icon"
          /></a>
        </div>
        <h1 id="title">Login</h1>
      </div>
      <form class="login">
        <input
          type="text"
          placeholder="Username"
          class="input"
          id="username_input"
        />
        <p class="form_error" id="username_error"></p>

        <input
          type="password"
          placeholder="Password"
          class="input"
          id="password_input"
        />
        <p class="form_error" id="password_error"></p>

        <button type="submit" id="submit_button">Login</button>
      </form>
      <p class="register_para">
        Don't have an account?
        <b
          ><a href="./register_user.html" id="register_page_link"
            >Register</a
          ></b
        >
      </p>
    </div>
    <script
      type="module"
      src="../javascript/login_register_user/login_user.js"
    ></script>
  </body>
</html>
